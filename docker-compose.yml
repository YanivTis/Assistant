services:
  assistant:
    build: .
    container_name: whatsapp-assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_PATH=/data/assistant.db
    volumes:
      - assistant-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  assistant-data:
